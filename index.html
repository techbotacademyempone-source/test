<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 MPU6050 STL Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: #f9fafb; }
    header { padding: 16px 20px; background: #1f2937; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    h1 { margin: 0; font-size: 20px; flex: 1; }
    button, input[type="file"] { font: inherit; }
    button { border: 0; border-radius: 6px; padding: 9px 13px; color: white; background: #2563eb; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #disconnectButton { background: #dc2626; }
    #fileInput { max-width: 260px; }
    #viewer { height: calc(100vh - 132px); min-height: 420px; }
    #status { padding: 8px 20px; color: #d1d5db; background: #111827; font-size: 14px; }
    #orientation { position: fixed; right: 16px; bottom: 16px; padding: 10px 12px; border-radius: 6px; background: rgba(17, 24, 39, .85); font-family: monospace; line-height: 1.5; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>ESP32 MPU6050 STL Viewer</h1>
    <input id="fileInput" type="file" accept=".stl,model/stl" />
    <button id="connectButton">Connect ESP32</button>
    <button id="disconnectButton" disabled>Disconnect</button>
  </header>
  <div id="status">Choose an STL file, then connect the ESP32.</div>
  <div id="viewer"></div>
  <div id="orientation">Roll: 0.00°<br>Pitch: 0.00°<br>Yaw: 0.00°</div>

  <script type="module">
    import * as THREE from "three";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const viewer = document.getElementById("viewer");
    const fileInput = document.getElementById("fileInput");
    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const status = document.getElementById("status");
    const orientationText = document.getElementById("orientation");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202938);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
    camera.position.set(0, 0, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    viewer.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(50, 50, 100);
    scene.add(light, new THREE.GridHelper(200, 20, 0x555555, 0x333333));

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);
    const loader = new STLLoader();
    let model = null;
    let port = null;
    let reader = null;
    let keepReading = false;
    const orientation = { roll: 0, pitch: 0, yaw: 0 };

    function resize() {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener("resize", resize);
    resize();

    function loadModel(url, fileName, revokeUrl = false) {
      loader.load(url, (geometry) => {
        if (model) {
          modelGroup.remove(model);
          model.geometry.dispose();
          model.material.dispose();
        }
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        const center = geometry.boundingBox.getCenter(new THREE.Vector3());
        const size = geometry.boundingBox.getSize(new THREE.Vector3());
        geometry.translate(-center.x, -center.y, -center.z);
        model = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.65 }));
        model.scale.setScalar(80 / Math.max(size.x, size.y, size.z));
        modelGroup.add(model);
        if (revokeUrl) URL.revokeObjectURL(url);
        status.textContent = `Loaded: ${fileName}`;
      }, undefined, () => {
        if (revokeUrl) URL.revokeObjectURL(url);
        status.textContent = "Could not load the STL file.";
      });
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadModel(url, file.name, true);
    });

    loadModel("Dazzling%20Maimu-Snaget.stl", "Dazzling Maimu-Snaget.stl");

    function updateOrientation() {
      modelGroup.rotation.set(
        THREE.MathUtils.degToRad(orientation.pitch),
        THREE.MathUtils.degToRad(orientation.yaw),
        THREE.MathUtils.degToRad(orientation.roll),
        "XYZ"
      );
      orientationText.innerHTML = `Roll: ${orientation.roll.toFixed(2)}°<br>Pitch: ${orientation.pitch.toFixed(2)}°<br>Yaw: ${orientation.yaw.toFixed(2)}°`;
    }

    function parseOrientation(line) {
      // Matches: Roll: 1.23 deg, Pitch: -4.56 deg, Yaw: 7.89 deg
      const match = line.match(/Roll:\s*(-?(?:\d+\.?\d*|\.\d+)).*?Pitch:\s*(-?(?:\d+\.?\d*|\.\d+)).*?Yaw:\s*(-?(?:\d+\.?\d*|\.\d+))/i);
      if (!match) return;
      orientation.roll = Number(match[1]);
      orientation.pitch = Number(match[2]);
      orientation.yaw = Number(match[3]);
      updateOrientation();
      status.textContent = `Receiving ESP32 data: ${line.trim()}`;
    }

    async function readSerial() {
      const decoder = new TextDecoderStream();
      const pipe = port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();
      let buffer = "";
      try {
        while (keepReading) {
          const result = await reader.read();
          if (result.done) break;
          buffer += result.value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || "";
          lines.forEach(parseOrientation);
        }
      } catch (error) {
        if (keepReading) status.textContent = `Serial read error: ${error.message}`;
      } finally {
        reader.releaseLock();
        pipe.catch(() => {});
      }
    }

    connectButton.addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        status.textContent = "Web Serial requires Chrome/Edge on HTTPS or localhost.";
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        keepReading = true;
        connectButton.disabled = true;
        disconnectButton.disabled = false;
        status.textContent = "Connected. Waiting for Roll/Pitch/Yaw lines...";
        readSerial();
      } catch (error) {
        status.textContent = `Connection failed: ${error.message}`;
      }
    });

    disconnectButton.addEventListener("click", async () => {
      keepReading = false;
      if (reader) await reader.cancel().catch(() => {});
      if (port) await port.close().catch(() => {});
      reader = null;
      port = null;
      connectButton.disabled = false;
      disconnectButton.disabled = true;
      status.textContent = "ESP32 disconnected.";
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
